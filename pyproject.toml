[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stinger-python-utils"
version = "0.5.0"
description = "Common utilities for Stinger Python services."
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"

dependencies = [
    "pydantic>=2.5.3",
    "pyqttier>=0.3.0",
    "py-stinger-conn-iface>=0.1.3",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "black>=23.3.0",
    "mypy>=1.4.1",
    "pytest>=7.0.0; python_version >= '3.10'",
    "pytest>=6.2.0,<7.0.0; python_version < '3.10'",
]
